# Builds and tests this repository on its own, as a clone of it builds: the plugin and the version catalog come from
# maven.xali.host, and so does every Xali library (the versions the catalog pins). Nothing here needs another repository.
# The workspace (Xalitoria/xali-craft) builds the repositories together at their newest commits; that is its own workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # No public repository has the DiscordSRV API, and only XaliChat compiles against it.
      - name: Install the DiscordSRV API
        if: ${{ github.event.repository.name == 'xali-chat' }}
        run: |
          git clone --depth 1 https://github.com/DiscordSRV/Ascension.git "$RUNNER_TEMP/ascension"
          cd "$RUNNER_TEMP/ascension"
          ./gradlew :api:publishToMavenLocal --console=plain

      - name: Build and test
        run: ./gradlew build --console=plain
