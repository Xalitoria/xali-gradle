[versions]
kotlin = "2.4.20"
shadow = "9.3.0"
minecraft = "26.2+"
jackson = "2.17.2"
ktor = "3.4.0"
exposed = "1.0.0"
adventure = "4.26.1"
coroutines = "1.10.2"
serialization = "1.8.1"
nuvotifier = "2.7.1"

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.6" }
minecraft = { id = "mc.xalitoria.minecraft", version = "0.1.0"}

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
asm-commons = { module = "org.ow2.asm:asm-commons", version = "9.9" }

kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-serialization-hocon = { module = "org.jetbrains.kotlinx:kotlinx-serialization-hocon", version.ref = "serialization" }

ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio-jvm", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }

jedis = { module = "redis.clients:jedis", version = "6.0.0" }
kaml = { module = "com.charleskorn.kaml:kaml", version = "0.104.0" }
mixbox = { module = "com.scrtwpns:mixbox", version = "2.0.0" }

jackson-core = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }

paper-api = { module = "io.papermc.paper:paper-api", version.ref = "minecraft" }
folia-api = { module = "dev.folia:folia-api", version.ref = "minecraft" }
velocity-api = { module = "com.velocitypowered:velocity-api", version = "4.2.0" }

discordsrv = { module = "com.discordsrv:discordsrv-api", version = "3.0.0+" }
nbtapi = { module = "de.tr7zw:item-nbt-api-plugin", version = "2.15.2" }
nuvotifier-universal = { module = "com.github.NuVotifier.NuVotifier:nuvotifier-universal", version.ref = "nuvotifier" }
nuvotifier-velocity = { module = "com.github.NuVotifier.NuVotifier:nuvotifier-velocity", version.ref = "nuvotifier" }
protocollib = { module = "net.dmulloy2:ProtocolLib", version = "5.5.0+" }
plan = { module = "com.github.plan-player-analytics:Plan", version = "5.9.3705" }
placeholderapi = { module = "me.clip:placeholderapi", version = "2.12.3" }
vanish-api = { module = "com.github.LeonMangler:SuperVanish", version = "6.2.18-3" }
premiumvanish-api = { module = "com.github.LeonMangler:PremiumVanishAPI", version = "2.9.18-2" }
vault = { module = "com.github.MilkBowl:VaultAPI", version = "1.7" }
vaultunlocked = { module = "net.milkbowl.vault:VaultUnlockedAPI", version = "2.16" }
itemsadder = { module = "com.github.LoneDev6:API-ItemsAdder", version = "3.6.1" }
nexo = { module = "com.nexomc:nexo", version = "1.29.1" }
skinsrestorer = { module = "net.skinsrestorer:skinsrestorer-api", version = "15.12.6" }
headdatabase = { module = "com.arcaniax:HeadDatabase-API", version = "1.3.2" }

# The Xali libraries, as other modules depend on them. The workspace swaps in the projects (see build.gradle.kts).
xalicraft-color = { module = "mc.xalitoria:color", version = "0.1.0" }
xalicraft-util = { module = "mc.xalitoria:util", version = "0.1.0" }
xali-chat-api = { module = "mc.xalitoria.chat:api", version = "0.7.1" }
xali-menu-api = { module = "mc.xalitoria.menu:api", version = "0.0.1" }

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-migration-jdbc = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }

hikaricp = { module = "com.zaxxer:HikariCP", version = "7.1.0" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version = "3.5.9" }
mysql = { module = "com.mysql:mysql-connector-j", version = "9.3.0" }
sqlite = { module = "org.xerial:sqlite-jdbc", version = "3.47.1.0" }

adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-kotlin = { module = "net.kyori:adventure-extra-kotlin", version.ref = "adventure" }
adventure-nbt = { module = "net.kyori:adventure-nbt", version.ref = "adventure" }
minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
minimessage-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
minimessage-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
minimessage-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }

[bundles]
adventure = [
    "adventure-api",
    "adventure-kotlin",
    "adventure-nbt",
    "minimessage",
    "minimessage-gson",
    "minimessage-legacy",
    "minimessage-plain"
]
database = [
    "hikaricp",
    "mariadb",
    "mysql",
    "sqlite"
]
exposed = [
    "exposed-core",
    "exposed-dao",
    "exposed-jdbc",
    "exposed-kotlin-datetime",
    "exposed-migration-jdbc"
]